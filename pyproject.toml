[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-media-rl"
version = "0.1.0"
description = "MVP de retail media con Q-learning, CPC y pacing"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["retail_media*"]

[tool.setuptools.package-data]
retail_media = ["default_config.json", "report.html"]
