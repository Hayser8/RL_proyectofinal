[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-media-rl"
version = "0.2.0"
description = "Laboratorio interactivo de retail media con RL basado en modelo y controles de conversión"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["retail_media*"]

[tool.setuptools.package-data]
retail_media = ["default_config.json", "report.html", "web/*", "web/fonts/*", "web/images/*"]
